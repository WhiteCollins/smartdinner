name: ARCHIVED - Flutter CI (duplicate)
on:
  # Deshabilitado para evitar duplicidad con frontend-ci.yml
  workflow_dispatch:

jobs:
  build-test:
    if: false # archivo archivado; no ejecutar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Build web
        run: flutter build web
